name: Deploy Prod

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2

      # FIX FOR YANDEX CLOUD
      - id: install-aws-cli
        uses: unfor19/install-aws-cli-action@v1
        with:
          version: 2.22.35

      - name: Install Dependencies
        run: bun install

      - name: Build
        run: bun run build

      - name: Upload to s3
        run: |
          aws s3 sync ./dist s3://wotstat.info \
            --cache-control "max-age=31104000, public" \
            --endpoint-url=https://storage.yandexcloud.net/ \
            --delete

          aws s3 cp \
            s3://wotstat.info/index.html s3://wotstat.info/index.html \
            --cache-control "public, max-age=300" \
            --endpoint-url=https://storage.yandexcloud.net/

          aws s3 cp \
            s3://wotstat.info/sitemap.xml s3://wotstat.info/sitemap.xml \
            --content-type "text/xml; charset=utf-8" \
            --endpoint-url=https://storage.yandexcloud.net/
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ru-central1

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh/
          printf '%s\n' "$SSH_KEY" > ~/.ssh/production.key
          chmod 600 ~/.ssh/production.key
          cat >>~/.ssh/config <<END
          Host node
            HostName $SSH_HOST
            User $SSH_USER
            IdentityFile ~/.ssh/production.key
            StrictHostKeyChecking no
          END
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}

      - name: Copy to server
        run: |
          find dist/assets dist-meta/client/assets -type f -exec touch {} +
          ssh node "mkdir -p '${{ vars.APP_PATH }}'"
          rsync -avz --delay-updates ./dist ./dist-meta "node:${{ vars.APP_PATH }}/"

      - name: Remove old assets
        run: |
          # 7 days since the asset last appeared in a deployed build.
          ssh node "find '${{ vars.APP_PATH }}/dist/assets' '${{ vars.APP_PATH }}/dist-meta/client/assets' -type f -mmin +10080 -delete"
