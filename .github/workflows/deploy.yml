name: Deploy Prod

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2

      # FIX FOR YANDEX CLOUD
      - id: install-aws-cli
        uses: unfor19/install-aws-cli-action@v1
        with:
          version: 2.22.35

      - name: Install Dependencies
        run: bun install

      - name: Build
        run: bun run build

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh/
          printf '%s\n' "$SSH_KEY" > ~/.ssh/production.key
          chmod 600 ~/.ssh/production.key
          cat >>~/.ssh/config <<END
          Host node
            HostName $SSH_HOST
            User $SSH_USER
            IdentityFile ~/.ssh/production.key
            StrictHostKeyChecking no
          END
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}

      - name: Copy to server
        env:
          APP_PATH: ${{ vars.APP_PATH }}
        run: |
          incoming="$APP_PATH/incoming/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          printf -v command '%q ' mkdir -p "$incoming"
          ssh node "$command"
          rsync -avz --protect-args ./dist ./dist-meta "node:$incoming/"
          echo "DEPLOY_INCOMING=$incoming" >> "$GITHUB_ENV"

      - name: Activate release
        env:
          META_APP_PATH: ${{ vars.META_APP_PATH }}
        run: |
          printf -v command '%q ' sh "$META_APP_PATH/current/rerun.sh" frontend \
            --app-dir "$META_APP_PATH" --incoming "$DEPLOY_INCOMING"
          ssh node "$command"

      - name: Upload to s3
        run: |
          aws s3 sync ./dist s3://wotstat.info \
            --cache-control "max-age=31104000, public" \
            --endpoint-url=https://storage.yandexcloud.net/ \
            --delete

          aws s3 cp \
            s3://wotstat.info/index.html s3://wotstat.info/index.html \
            --cache-control "public, max-age=300" \
            --endpoint-url=https://storage.yandexcloud.net/

          aws s3 cp \
            s3://wotstat.info/sitemap.xml s3://wotstat.info/sitemap.xml \
            --content-type "text/xml; charset=utf-8" \
            --endpoint-url=https://storage.yandexcloud.net/
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ru-central1